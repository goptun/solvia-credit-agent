name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy .

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector:pg16 is a strict superset of postgres:16-alpine
        # (same Postgres 16, `vector`/`unaccent` extensions preinstalled) —
        # one service backs both the checkpointer tests and rag_chunks.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: solvia
          POSTGRES_PASSWORD: solvia
          POSTGRES_DB: solvia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solvia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://solvia:solvia@localhost:5432/solvia_test
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Migrate rag_chunks schema
        run: uv run python -m rag.migrate

      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
