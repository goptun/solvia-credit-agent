answerable:
  # cdc-consolidada (Lei nº 8.078/1990) — 3 generic + 6 credit-specific
  - question: "O que a lei garante pra proteger quem compra um produto ou contrata um serviço?"
    expected_document_id: cdc-consolidada
    expected_refs: ["art. 6º"]
    evidence: "a proteção da vida, saúde e segurança contra os riscos provocados por práticas no"
    style: colloquial

  - question: "O que acontece quando um produto apresenta um vício de qualidade que o torna impróprio para uso?"
    expected_document_id: cdc-consolidada
    expected_refs: ["art. 18"]
    evidence: "pode o consumidor\nexigir, alternativamente e à sua escolha"

  - question: "Uma cláusula de contrato que impede o consumidor de pedir indenização é válida?"
    expected_document_id: cdc-consolidada
    expected_refs: ["art. 51", "art. 25"]
    evidence: "É vedada a estipulação contratual de cláusula que impossibilite, exonere ou\natenue a obrigação de indenizar"

  - question: "O que caracteriza uma situação de superendividamento segundo o código de defesa do consumidor?"
    expected_document_id: cdc-consolidada
    expected_refs: ["art. 54-A"]
    evidence: "a impossibilidade manifesta de o consumidor \npessoa natural, de boa-fé, pagar a totalidade de suas dívidas"

  - question: "O que o banco precisa avisar antes de me dar um emprestimo ou vender fiado?"
    expected_document_id: cdc-consolidada
    expected_refs: ["art. 54-B"]
    evidence: "deverá informar o consumidor, prévia e \nadequadamente"
    style: colloquial

  - question: "Que tipo de afirmação é proibida na publicidade ou oferta de crédito ao consumidor?"
    expected_document_id: cdc-consolidada
    expected_refs: ["art. 54-C"]
    evidence: "indicar \nque a operação de crédito poderá ser concluída sem consulta a serviços de \nproteção ao crédito"

  - question: "O fornecedor de crédito é obrigado a avaliar se o consumidor tem condições de pagar antes de conceder o crédito?"
    expected_document_id: cdc-consolidada
    expected_refs: ["art. 54-D"]
    evidence: "avaliar, de forma responsável, as condições de crédito do consumidor"

  - question: "Existe um limite para o valor da multa cobrada quando o consumidor atrasa o pagamento de uma prestação?"
    expected_document_id: cdc-consolidada
    expected_refs: ["art. 52"]
    evidence: "As multas de\nmora decorrentes do inadimplemento de obrigações no seu termo não poderão ser\nsuperiores a dois por cento"

  - question: "O consumidor pode quitar uma dívida antes do prazo com desconto nos juros?"
    expected_document_id: cdc-consolidada
    expected_refs: ["art. 52"]
    evidence: "assegurado ao consumidor a liquidação antecipada do débito, total ou\nparcialmente"

  # lgpd (Lei nº 13.709/2018)
  - question: "Em quais situações é permitido fazer o tratamento de dados pessoais de uma pessoa?"
    expected_document_id: lgpd
    expected_refs: ["art. 7º"]
    evidence: "mediante o fornecimento de consentimento pelo titular"

  - question: "O titular dos dados tem direito de saber facilmente como seus dados são usados?"
    expected_document_id: lgpd
    expected_refs: ["art. 9º"]
    evidence: "direito ao acesso facilitado às informações sobre o tratamento de seus dados"

  - question: "Quais direitos o titular dos dados pode exigir do controlador a qualquer momento?"
    expected_document_id: lgpd
    expected_refs: ["art. 18"]
    evidence: "confirmação da existência de tratamento"

  - question: "As empresas são obrigadas a adotar medidas de segurança técnicas para proteger dados pessoais?"
    expected_document_id: lgpd
    expected_refs: ["art. 46"]
    evidence: "medidas de segurança, técnicas e administrativas aptas a proteger os dados pessoais"

  - question: "Se vazarem meus dados pessoais de uma empresa, ela é obrigada a me avisar?"
    expected_document_id: lgpd
    expected_refs: ["art. 48"]
    evidence: "comunicar à autoridade nacional e ao titular a ocorrência de incidente de segurança"
    style: colloquial

  - question: "Qual órgão foi criado para fiscalizar a proteção de dados pessoais no Brasil?"
    expected_document_id: lgpd
    expected_refs: ["art. 55-A"]
    evidence: "Fica criada a Agência Nacional de \n\t\tProteção de Dados (ANPD)"

  # open-finance-regulamento (Resolução Conjunta BCB/CMN nº 1/2020)
  - question: "Sobre o que trata a norma que regulamenta o Open Finance no Brasil?"
    expected_document_id: open-finance-regulamento
    expected_refs: ["art. 1º"]
    evidence: "dispõe sobre a implementação do Open Finance"

  - question: "Quais etapas fazem parte do processo de solicitação de compartilhamento de dados no Open Finance?"
    expected_document_id: open-finance-regulamento
    expected_refs: ["art. 8º"]
    evidence: "compreende\nas etapas do consentimento, autenticação e confirmação"

  - question: "Que padrão de autenticação as instituições participantes do Open Finance precisam seguir?"
    expected_document_id: open-finance-regulamento
    expected_refs: ["art. 17"]
    evidence: "devem ser\ncompatíveis com os aplicáveis ao acesso, pelos clientes"

  - question: "O banco pode colocar empecilho pra dificultar o compartilhamento dos meus dados no Open Finance?"
    expected_document_id: open-finance-regulamento
    expected_refs: ["art. 28"]
    evidence: "vedado às instituições participantes a criação de obstáculos ao\ncompartilhamento"
    style: colloquial

  # cet-disclosure (Resolução CMN nº 4.881/2020)
  - question: "No fim das contas, o que e esse tal de Custo Efetivo Total do credito?"
    expected_document_id: cet-disclosure
    expected_refs: ["art. 2º"]
    evidence: "O CET é uma taxa que representa, na data de seu cálculo, de forma\nconsolidada"
    style: colloquial

  - question: "Quais valores entram no cálculo do Custo Efetivo Total de um empréstimo?"
    expected_document_id: cet-disclosure
    expected_refs: ["art. 3º"]
    evidence: "deve abranger o valor do crédito a ser concedido"

  - question: "Em que momento o banco é obrigado a informar o CET ao cliente antes da contratação?"
    expected_document_id: cet-disclosure
    expected_refs: ["art. 7º"]
    evidence: "previamente à contratação das operações"

  - question: "Como é calculado o CET de operações de cheque especial ou crédito rotativo?"
    expected_document_id: cet-disclosure
    expected_refs: ["art. 6º"]
    evidence: "operações de adiantamento a depositantes, de desconto,\nde cheque especial"

  # product-catalog (fictional product descriptions)
  - question: "Quais formas de amortização estão disponíveis no crédito pessoal da Solvia?"
    expected_document_id: product-catalog
    evidence: "nas modalidades Price (parcelas fixas) e SAC (parcelas decrescentes)"

  - question: "Da pra parcelar o credito da Solvia de um jeito que a parcela vai diminuindo com o tempo?"
    expected_document_id: product-catalog
    evidence: "amortização constante, com parcelas que diminuem ao longo do tempo"
    style: colloquial

