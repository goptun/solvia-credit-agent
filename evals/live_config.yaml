# Underlying models each gateway alias may resolve to during a live run.
#
# `expected`: every model a run may legitimately hit; any call that resolves
#             outside it contaminates the run.
# `primary`:  the subset that counts as the normal path; too many calls
#             outside it (EVALS_MAX_FALLBACK_SHARE) contaminates the run.
#
# Approved by the maintainer at gate 13.3 (option A: record what the free tier
# actually serves). On the free tier both aliases resolve to the same lite
# model, so the fast/smart split is nominal in this baseline. Gateway-internal
# fallbacks are invisible to the harness except through the resolved model.
# Underlying model names are measured output, allowed in evaluation tooling
# and reports (never in application code).
aliases:
  solvia-fast:
    expected:
      - gemini/gemini-3.5-flash-lite
      - gemini/gemini-3.1-flash-lite-preview
      - gemini/gemini-3.6-flash
      - cf/@cf/openai/gpt-oss-120b
    primary:
      - gemini/gemini-3.5-flash-lite
  solvia-smart:
    expected:
      - gemini/gemini-3.8-flash
      - gemini/gemini-3.6-flash
      - gemini/gemini-3-flash-preview
      - gemini/gemini-3.5-flash-lite
      - cf/@cf/openai/gpt-oss-120b
    primary:
      - gemini/gemini-3.5-flash-lite
