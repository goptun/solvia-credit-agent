services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-solvia}:${POSTGRES_PASSWORD:-solvia}@postgres:5432/${POSTGRES_DB:-solvia}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solvia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solvia}
      POSTGRES_DB: ${POSTGRES_DB:-solvia}
    ports:
      - "5432:5432"
    volumes:
      - solvia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solvia}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  solvia_postgres_data:
