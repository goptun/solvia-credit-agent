[project]
name = "solvia"
version = "0.1.0"
description = "Agentic credit assistant for contact centers, powered by Open Finance Brasil data and LangGraph."
authors = [
    { name = "goptun", email = "ramos.matheus@icloud.com" }
]
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps", "services", "tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
