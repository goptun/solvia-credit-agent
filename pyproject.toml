[project]
name = "solvia"
version = "0.1.0"
description = "Agentic credit assistant for contact centers, powered by Open Finance Brasil data and LangGraph."
authors = [
    { name = "goptun", email = "ramos.matheus@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-core>=1.6.4",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.4",
    "langfuse>=4.15.4",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps", "services", "tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
