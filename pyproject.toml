[project]
name = "solvia"
version = "0.1.0"
description = "Agentic credit assistant for contact centers, powered by Open Finance Brasil data and LangGraph."
authors = [
    { name = "goptun", email = "ramos.matheus@icloud.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "langchain-core>=1.6.4",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.4",
    "langfuse>=4.15.4",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "lxml>=6.1.3",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = false
# fastembed pulls in onnxruntime, which stopped shipping macOS x86_64
# wheels after 1.23.x; declaring this platform required keeps the
# resolver on a version that still has one, instead of resolving to a
# wheel-less latest that only installs on arm64/Linux.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps", "services", "tests", "scripts", "rag"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]
